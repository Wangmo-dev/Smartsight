<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🇧🇹 Bhutan Travel Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #e0f7fa, #fff);
        }

        header {
            background-color: #00796B;
            color: white;
            padding: 20px;
            text-align: center;
        }

        #welcome {
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
            font-size: 1.1rem;
        }

        #chatbox {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            background-color: white;
            padding: 10px;
            margin: 20px;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 70%;
            clear: both;
            line-height: 1.4;
        }

        .user {
            background-color: #c5cae9;
            color: #1a237e;
            float: right;
        }

        .bot {
            background-color: #dcedc8;
            color: #33691e;
            float: left;
        }

        #userInputArea {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: #f5f5f5;
        }

        #userInput {
            width: 70%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            margin-left: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: #00796B;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d40;
        }

        #suggestions {
            margin: 20px;
            padding: 15px;
            background-color: #fff3e0;
            border: 1px dashed #ff9800;
            border-radius: 10px;
        }

        #suggestions h3 {
            margin-top: 0;
        }

        .tag {
            display: inline-block;
            background-color: #ffe0b2;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 15px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .tag:hover {
            background-color: #ffcc80;
        }
    </style>
</head>
<body>
    <header>
        <h1>🇧🇹 Bhutan Travel Assistant</h1>
        <p>Your smart companion for exploring Bhutan</p>
    </header>

    <div id="welcome">
        👋 Welcome to your AI-powered Bhutan travel guide! Ask me anything about destinations, food, permits, culture, and more.
    </div>

    <div id="chatbox"></div>

    <div id="userInputArea">
        <input type="text" id="userInput" placeholder="Ask about Bhutan travel...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <div id="suggestions">
        <h3>✨ Popular Topics</h3>
        <span class="tag" onclick="quickAsk('Top places to visit in Bhutan?')">Top places</span>
        <span class="tag" onclick="quickAsk('Do I need a visa to enter Bhutan?')">Visa Info</span>
        <span class="tag" onclick="quickAsk('What is the best time to visit Bhutan?')">Best time</span>
        <span class="tag" onclick="quickAsk('How to get a guide in Bhutan?')">Guides</span>
        <span class="tag" onclick="quickAsk('Tell me about Bhutanese cuisine.')">Cuisine</span>
    </div>

    <script>
        function appendMessage(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = (sender === 'bot') ? `🤖 ${text}` : `🧑 ${text}`;
            chatbox.appendChild(msgDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const userMessage = input.value.trim();
            if (userMessage === '') return;

            appendMessage(userMessage, 'user');

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                appendMessage(data.response.replace(/\n/g, '<br>'), 'bot');
            })
            .catch(() => {
                appendMessage("Sorry, I couldn't connect to the server. Try again later.", 'bot');
            });

            input.value = '';
        }

        function quickAsk(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }

        // Allow Enter key to send message
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
